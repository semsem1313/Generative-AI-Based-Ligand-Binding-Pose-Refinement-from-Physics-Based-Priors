name: Convert Reports

on:
  push:
    branches: [main]
    paths:
      - 'reports/in docx format/*.docx'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: Convert all docx reports to PDF
        run: |
          mkdir -p "reports/in pdf format"
          for file in "reports/in docx format"/*.docx; do
            soffice --headless --convert-to pdf --outdir "reports/in pdf format" "$file"
          done

      - name: Commit converted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-convert reports to PDF"
          file_pattern: "reports/in pdf format/*"
