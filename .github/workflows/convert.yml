name: Convert Reports

on:
  push:
    branches: [main]
    paths:
      - 'reports/docx/*.docx'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: Convert all docx reports to PDF
        run: |
          # Enable nullglob so the loop safely skips if no matching files are found
          shopt -s nullglob

          mkdir -p reports/pdf

          for file in reports/docx/*.docx; do
            echo "Converting $file..."
            soffice --headless --convert-to pdf --outdir reports/pdf "$file"
          done

      - name: Commit converted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-convert reports to PDF"
          file_pattern: "reports/pdf/*"
